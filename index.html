<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/shinkaido-mark.svg" />
    <link rel="apple-touch-icon" href="/shinkaido-mark.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#F5F0E6" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- #298D closed beta: do not index. Remove/revisit before public launch. -->
    <meta name="robots" content="noindex, nofollow" />
    <meta
      name="description"
      content="ShinkAIdo — The Way to Your True Self. A calm, capable AI companion for conversation, work, study, and discovery."
    />
    <title>ShinkAIdo — The Way to Your True Self.</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <!-- #358D — apply saved theme before paint (same store as ChatContext; default WASHI). -->
    <script>
      (function () {
        try {
          var raw =
            localStorage.getItem('laife.settings.v2') ||
            localStorage.getItem('laife.settings.v1')
          var id = 'the-way-washi'
          if (raw) {
            var parsed = JSON.parse(raw)
            var saved = parsed && parsed.theme && parsed.theme.activeThemeId
            if (typeof saved === 'string' && saved.trim()) id = saved.trim()
          }
          var root = document.documentElement
          root.setAttribute('data-theme', id)
          var dark = {
            'the-way-sumi': 1,
            laife: 1,
            dark: 1,
            amoled: 1,
            ocean: 1,
            forest: 1,
            sunset: 1,
            royal: 1,
            cyber: 1,
            midnight: 1,
          }
          var scheme = dark[id] ? 'dark' : 'light'
          root.style.colorScheme = scheme
          root.setAttribute('data-color-scheme', scheme)
          var meta = document.querySelector('meta[name="theme-color"]')
          if (meta) {
            if (id === 'the-way-washi') meta.setAttribute('content', '#F5F0E6')
            else if (id === 'the-way-sumi') meta.setAttribute('content', '#100E0C')
          }
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
